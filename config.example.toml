[runtime]
symbols = [
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOG", "GOOGL", "META", "TSLA", "AVGO", "COST",
  "NFLX", "ASML", "AMD", "PEP", "CSCO", "ADBE", "QCOM", "INTU", "AMAT", "TXN",
  "BKNG", "ISRG", "MU", "HON", "VRTX", "REGN", "PANW", "KLAC", "LRCX", "SNPS",
  "CDNS", "ABNB", "MELI", "ORLY", "FTNT", "CTAS", "MRVL", "MNST", "KDP", "ODFL",
  "DXCM", "TEAM", "FAST", "ROST", "IDXX", "BIIB", "VRSK", "GEHC", "ON", "NXPI",
  "CTSH", "CPRT", "PCAR", "PAYX", "DLTR", "ANSS", "FANG", "ZS", "CRWD", "DDOG",
  "EBAY", "EXC", "ILMN", "LULU", "MAR", "MCHP", "MDLZ", "MRNA", "PYPL", "SBUX",
  "WDAY", "ADP", "ALGN", "GILD", "MTCH", "NDAQ", "TTWO", "WBD", "ENPH", "ENTG"
]
timeframe = "1d"
htf_filter = ["1h", "1d"]
interval_seconds = 86400
cache_dir = "data/cache"

[symbols]
high_risk      = ["NVDA", "MRVL", "ZS", "ON"]
low_risk       = ["KLAC", "LRCX", "AMAT", "ASML"]
track1_symbols = ["NVDA", "MRVL", "CRWD", "ZS", "ON"]
track2_symbols = ["MU", "LRCX", "NFLX", "KLAC"]

[scoring]
track1_threshold  = 4   # 바닥반등 트랙 최소 점수 (max 9)
track2_threshold  = 5   # 눌림목 트랙 최소 점수 (max 6)
ai_call_threshold = 6
min_s_hits_for_ai = 2

[weights]
# S-grade (3pts each)
wvf_spike = 3
volume_capitulation_spike = 3
obv_divergence = 3
# A-grade (1pt each)
mfi = 1
cmf = 1
triple_stoch_rsi = 1
macd_divergence = 1
ad_line_divergence = 1
composite_oscillator = 1
vpt = 1
nvi_pvi = 1
rsi_sma200 = 1
bb_stoch = 1
macd_obv_divergence = 1
fibonacci_618 = 1
ichimoku_rsi_obv = 1
k_reversal = 1

[alerts]
cooldown_minutes = 120
strengthen_delta = 3
allow_premarket = true
allow_regular = true

[ai]
per_symbol_daily = 3
global_daily = 20
anthropic_api_key = ""   # sk-ant-... 입력 시 Claude 자동 활성화, 빈 칸이면 규칙 기반 fallback

[backtest]
lookback_months = 12
precision_rebound_days = 5
precision_rebound_threshold_pct = 3.0
target_precision_pct = 70.0
target_mdd_pct = -5.0
target_avg_rebound_pct = 5.0

[telegram]
bot_token = ""
chat_id   = ""
db_path   = "trades.db"   # SQLite 매수 기록 경로 (VPS: /opt/m7-bottomfinder/trades.db)
