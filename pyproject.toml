[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m7-bottomfinder"
version = "0.1.0"
description = "Data-layer foundation for M7 BottomFinder"
requires-python = ">=3.11"

dependencies = [
    "schedule",
    "pytz",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
